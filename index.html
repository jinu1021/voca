<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HR Voca Master</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { width: 100vw; height: 100dvh; background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 12px 14px 40px 14px; }
    .dash, .quiz { display: none; flex-direction: column; height: 100%; }
    .active { display: flex; }
    .title { font-size: 24px; font-weight: 900; color: #38bdf8; text-align: center; margin-bottom: 10px; margin-top: 2px; }
    .btn-main { background: #38bdf8; color: #0f172a; border: none; border-radius: 12px; padding: 13px; font-size: 17px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    .btn-main:active { opacity: 0.8; }
    .btn-sub { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    .btn-sub span { color: #ef4444; font-weight: bold; }
    .btn-note { background: #1e293b; color: #f8fafc; border: 1px solid #475569; }
    .btn-note span { color: #f59e0b; font-weight: bold; }
    .history { flex: 1; background: #1e293b; border-radius: 12px; padding: 10px; overflow-y: auto; margin-bottom: 8px; border: 1px solid #334155; }
    .hist-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 14px; }
    .hist-item:last-child { border-bottom: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; color: #94a3b8; font-weight: bold; font-size: 15px; height: 24px; }
    .card { flex: 1; min-height: 0; background: #1e293b; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px 10px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.4); margin: 8px 0; position: relative; }
    .word-area { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .word { font-size: 36px; font-weight: 900; color: #38bdf8; word-break: keep-all; line-height: 1.2; }
    .word.ko { font-size: 26px; color: #f8fafc; }
    .speak-btn { background: #334155; border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .speak-btn:active { background: #475569; }
    .opts { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .opt-btn { background: #334155; color: #fff; border: none; border-radius: 12px; padding: 12px 10px; font-size: 18px; font-weight: 600; min-height: 52px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; word-break: keep-all; line-height: 1.2; }
    .opt-btn:active { opacity: 0.8; }
    .opt-btn.ok { background: #16a34a !important; font-weight: 800; }
    .opt-btn.no { background: #dc2626 !important; }
    .bot-bar { text-align: center; margin-top: 4px; }
    .txt-btn { background: none; border: none; color: #94a3b8; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 4px; }
    .mod { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(15,23,42,0.98); z-index: 99; padding: 16px 16px 50px 16px; flex-direction: column; }
    .ta { flex: 1; border-radius: 8px; padding: 12px; font-size: 15px; width: 100%; resize: none; margin-top: 12px; background: #1e293b; color: #fff; border: 1px solid #334155; }
    .m-btns { display: flex; gap: 10px; margin-top: 12px; height: 46px; }
    .m-btn { flex: 1; border-radius: 8px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
    .m-btn.s { background: #38bdf8; color: #0f172a; }
    .m-btn.c { background: #334155; color: #fff; }
    .note-list { flex: 1; overflow-y: auto; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .note-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .note-info { flex: 1; min-width: 0; }
    .note-word-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .note-w { font-size: 17px; font-weight: bold; color: #38bdf8; word-break: break-all; }
    .note-badge { background: #ef4444; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 10px; flex-shrink: 0; }
    .note-m { font-size: 14px; color: #cbd5e1; word-break: keep-all; }
    .btn-done { background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
    @media (max-height: 700px) {
      .word { font-size: 30px; }
      .word.ko { font-size: 22px; }
      .opt-btn { min-height: 46px !important; font-size: 16px !important; padding: 6px !important; }
    }
  </style>
</head>
<body>
  <div id="dash" class="dash active">
    <div class="title">HR Voca Master</div>
    <button class="btn-main" onclick="start(false)">새 퀴즈 시작 (20문제)</button>
    <button class="btn-main btn-sub" onclick="start(true)">틀린 단어 복습 (<span><b id="w-cnt">0</b></span>개)</button>
    <button class="btn-main btn-note" onclick="openNote()">오답 암기장 (<span><b id="n-cnt">0</b></span>개)</button>
    <div style="font-size:13px; color:#94a3b8; margin: 3px 0; font-weight:bold;">누적 성적</div>
    <div class="history" id="hist-list"></div>
    <div class="bot-bar"><button class="txt-btn" onclick="openM()">단어풀 추가/변경 (현재: <b id="t-cnt">0</b>개)</button></div>
  </div>

  <div id="quiz" class="quiz">
    <div class="top-bar">
      <span id="q-mode">퀴즈</span>
      <span id="q-prog" style="color:#38bdf8;">1 / 20</span>
    </div>
    <div class="card">
      <div class="word-area">
        <div class="word" id="qw">로딩중</div>
        <button class="speak-btn" onclick="speakWord()" title="발음 듣기">🔊</button>
      </div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="bot-bar"><button class="txt-btn" onclick="goDash()">중단하고 나가기</button></div>
  </div>

  <div class="mod" id="mod">
    <div style="color:#fff; font-weight:bold; font-size:18px;">단어풀 추가 및 수정</div>
    <textarea class="ta" id="ta" placeholder="추가할 단어=뜻, 단어=뜻 형태로 입력하세요. (기본값 초기화는 'reset' 입력)"></textarea>
    <div class="m-btns">
      <button class="m-btn s" onclick="saveM()">추가/적용하기</button>
      <button class="m-btn c" onclick="closeM()">취소</button>
    </div>
  </div>

  <div class="mod" id="note-mod">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div style="color:#fff; font-weight:bold; font-size:18px;">오답 암기장 <span style="font-size:13px; color:#f59e0b;">(자주 틀린 순)</span></div>
      <button class="txt-btn" style="color:#38bdf8; font-size:15px; text-decoration:none;" onclick="closeNote()">닫기 ✕</button>
    </div>
    <div class="note-list" id="note-list"></div>
  </div>

crual=발생/누적|investigatory=조사의|discharge=해고하다|criticism=비판|tripartite=노사정 3자의|executive order=행정명령|judicial=사법의|doctrines=법리|amendment=수정 조항|signify=의미하다|restrictions=제한|forbidding=금지하는|thermal=열의/온도의|injunction=법원 금지명령|exemplary=징벌적/모범적|routinely=일상적으로|formative=형성적인|arousal=각성|symptoms=증상|disillusionment=환멸|chronic fatigue=만성 피로|forgetfulness=건망증|irritable=예민한|defiance=저항/반항|exhaustion=탈진|adhere=준수하다|foreseeable=예견 가능한|vicarious=대리 책임의|convinced=확신하는|hypothetical=가상의|purview=관할 범위|contradicted=모순된|fatal=치명적인|hospitalization=입원|hunch=직감|overconfidence=과신|equivalent=동등한 것|pension=연금|gratification=만족감|due process=적법 절차|Imminent=임박한|Catastrophes=중대 재해|artifacts=가시적 산물(조직문화)|passionate=열정적인|collectivistic=집단주의적인|unholy=부당한|trinity=3대 요소|negligence=과실/태만|doctrine=법리/원칙|contributory=기여 과실의|servant=피용자|respondent=피고/사용자|quid pro quo=대가성 성희롱|supersedes=우선하다/대체하다|unreimbursed=미상환된|Affirmative Action Plan=적극적 우대조치 계획|placement=인력 배치|availability=인력 가용성|periodic=정기적인|Disparate treatment=의도적 차별 대우|chemotherapy=항암 화학요법|breast cancer=유방암|vestibule=모의 작업장 훈련|duty of diligence=주의 의무|obedience=복종의 의무|stratification=계층화|overreliance=지나친 의존|impoverished=무관심형(리더십)|perish=소멸하다|purposely=고의로|deliberate=의도적인|mastery=숙달|chronic=만성적인|fatigue=피로|irritability=과민성|inability to concentrate=집중력 저하|mood swings=감정 기복|social withdrawal=사회적 위축|procrastination=미루는 버릇|indecision=우유부단|indigestion=소화불량|intestinal problems=위장 장애|depression=우울증|circulating=유포되는|gossiping=뒷담화|gross misconduct=중대한 비위행위|taxable=과세 대상의|imputed=간주 소득의|exceeding=초과하는|dexterity=손재주|coordination=협응력|manual dexterity=수작업 능력|Psychomotor=정신운동의|is referred to=~로 불리다|sufficient=충분한|precedent=판례/선례|ad hoc=임시 특별의|conjunction=연계/결합|fatality=사망 사고|occurrence=발생 사건|deem as unlawful=불법으로 간주하다|focal=일괄 평가의|pension plan=연금 제도`;

    const basePool = dRaw.split('|').filter(Boolean).map(item => {
      let idx = item.indexOf('=');
      return { w: item.substring(0, idx).trim(), m: item.substring(idx + 1).trim() };
    });

    let pool = JSON.parse(JSON.stringify(basePool));
    let wrongW = {};
    let hist = [];
    try {
      let sP = localStorage.getItem('hr_p_v11'); if(sP) pool = JSON.parse(sP);
      let sW = localStorage.getItem('hr_w_v11') || localStorage.getItem('hr_w_v10'); if(sW) wrongW = JSON.parse(sW);
      let sH = localStorage.getItem('hr_h_v11') || localStorage.getItem('hr_h_v10'); if(sH) hist = JSON.parse(sH);
    } catch(e) {}
    
    function save() {
      try {
        localStorage.setItem('hr_p_v11', JSON.stringify(pool));
        localStorage.setItem('hr_w_v11', JSON.stringify(wrongW));
        localStorage.setItem('hr_h_v11', JSON.stringify(hist));
      } catch(e) {}
    }
    function shuf(a) { return a.slice().sort(()=>Math.random()-0.5); }
    function formatD(d) {
      var p = n => n<10?'0'+n:n;
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    }

    let qQueue = [], qTypes = [], qIdx = 0, qScore = 0, cur = null, isRev = false;

    function rDash() {
      document.getElementById('quiz').classList.remove('active');
      document.getElementById('dash').classList.add('active');
      let wKeys = Object.keys(wrongW);
      document.getElementById('w-cnt').innerText = wKeys.length;
      document.getElementById('n-cnt').innerText = wKeys.length;
      document.getElementById('t-cnt').innerText = pool.length;
      let hl = document.getElementById('hist-list');
      hl.innerHTML = '';
      if(hist.length===0) {
        hl.innerHTML = '<div style="color:#64748b; font-size:14px; text-align:center; padding:8px;">기록이 없습니다.</div>';
      }
      for(var i=hist.length-1; i>=0; i--) {
        let hi = hist[i];
        let d = document.createElement('div'); d.className='hist-item';
        let scoreText = (hi.score100 !== undefined ? hi.score100 : Math.round((hi.s / hi.t) * 100)) + '점';
        d.innerHTML = '<span>'+hi.d+(hi.r?' <b style="color:#ef4444;">[복습]</b>':'' )+'</span><span style="color:#38bdf8; font-weight:bold;">'+scoreText+' ('+hi.s+'/'+hi.t+')</span>';
        hl.appendChild(d);
      }
    }

    function start(rev) {
      isRev = rev;
      let src = rev ? Object.values(wrongW) : pool;
      if(src.length < 4) {
        alert(rev ? "틀린 단어가 부족합니다. (최소 4개 필요)" : "단어풀에 단어가 부족합니다. (최소 4개 필요)");
        return;
      }
      let limit = Math.min(src.length, 20);
      qQueue = shuf(src).slice(0, limit);
      qTypes = [];
      let half = Math.floor(limit / 2);
      for(let i=0; i<limit; i++) qTypes.push(i < half ? 0 : 1);
      qTypes = shuf(qTypes);
      qIdx = 0; qScore = 0;
      document.getElementById('dash').classList.remove('active');
      document.getElementById('quiz').classList.add('active');
      document.getElementById('q-mode').innerText = rev ? "틀린 단어 복습" : "일반 퀴즈";
      renderQ();
    }

    function speakWord(wText) {
      let wordToSpeak = wText || (cur ? cur.w : '');
      if (!wordToSpeak) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let u = new SpeechSynthesisUtterance(wordToSpeak);
        u.lang = 'en-US'; u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } else {
        alert("이 브라우저는 음성 재생을 지원하지 않습니다.");
      }
    }

    function renderQ() {
      document.getElementById('q-prog').innerText = (qIdx+1) + " / " + qQueue.length;
      cur = qQueue[qIdx];
      let cType = qTypes[qIdx], dist = [], pShuf = shuf(pool);
      for(var i=0; i<pShuf.length; i++) {
        if(pShuf[i].w !== cur.w && pShuf[i].m !== cur.m) dist.push(pShuf[i]);
        if(dist.length >= 3) break;
      }
      let opts = shuf([cur].concat(dist));
      let qw = document.getElementById('qw');
      qw.innerText = cType === 0 ? cur.w : cur.m;
      if(cType === 1) qw.classList.add('ko'); else qw.classList.remove('ko');

      let b = document.getElementById('opts');
      b.innerHTML = '';
      opts.forEach(o => {
        let btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = cType === 0 ? o.m : o.w;
        btn.onclick = () => checkA(btn, cType === 0 ? (o.m === cur.m) : (o.w === cur.w), cType);
        b.appendChild(btn);
      });
    }

    function checkA(btn, ok, cType) {
      let all = document.querySelectorAll('.opt-btn');
      all.forEach(x => x.style.pointerEvents = 'none');
      if(ok) {
        qScore++;
        btn.classList.add('ok');
      } else {
        btn.classList.add('no');
        if (!wrongW[cur.w]) {
          wrongW[cur.w] = { w: cur.w, m: cur.m, count: 1 };
        } else {
          wrongW[cur.w].count = (wrongW[cur.w].count || 0) + 1;
          wrongW[cur.w].m = cur.m;
        }
        let targetText = cType === 0 ? cur.m : cur.w;
        all.forEach(x => { if(x.innerText === targetText) x.classList.add('ok'); });
      }
      save();
      setTimeout(() => {
        qIdx++;
        if(qIdx < qQueue.length) renderQ(); else endQ();
      }, 800);
    }

    function endQ() {
      let finalScore = Math.round((qScore / qQueue.length) * 100);
      hist.push({ d: formatD(new Date()), s: qScore, t: qQueue.length, score100: finalScore, r: isRev });
      save();
      alert("퀴즈 완료! 성적: " + finalScore + "점 / 100점 (" + qScore + "/" + qQueue.length + "개 정답)");
      rDash();
    }

    function goDash() {
      if(confirm("정말로 퀴즈를 중단하시겠습니까? (성적은 저장되지 않습니다)")) rDash();
    }

    function openNote() {
      document.getElementById('note-mod').style.display = 'flex';
      renderNote();
    }
    function closeNote() {
      document.getElementById('note-mod').style.display = 'none';
      rDash();
    }

    function renderNote() {
      let nl = document.getElementById('note-list');
      nl.innerHTML = '';
      let list = Object.values(wrongW).sort((a, b) => (b.count || 1) - (a.count || 1));
      if(list.length === 0) {
        nl.innerHTML = '<div style="color:#94a3b8; font-size:15px; text-align:center; padding:30px 10px;">오답 기록이 없습니다.<br>모두 완벽히 암기하셨습니다! 🎉</div>';
        return;
      }
      list.forEach(item => {
        let card = document.createElement('div');
        card.className = 'note-card';
        let safeW = item.w.replace(/'/g, "\\'");
        card.innerHTML = `
          <div class="note-info">
            <div class="note-word-row">
              <span class="note-w">${item.w}</span>
              <button class="speak-btn" style="width:28px; height:28px; font-size:14px;" onclick="speakWord('${safeW}')">🔊</button>
              <span class="note-badge">${item.count || 1}회 오답</span>
            </div>
            <div class="note-m">${item.m}</div>
          </div>
          <button class="btn-done" onclick="completeWord('${safeW}')">암기완료</button>
        `;
        nl.appendChild(card);
      });
    }

    function completeWord(w) {
      if(wrongW[w]) {
        delete wrongW[w];
        save(); renderNote(); rDash();
      }
    }

    function openM() {
      document.getElementById('mod').style.display='flex';
      document.getElementById('ta').value = '';
    }
    function closeM() { document.getElementById('mod').style.display='none'; }

    function saveM() {
      let v = document.getElementById('ta').value;
      if(!v.trim()) return closeM();
      if(v.trim() === 'reset') {
        localStorage.removeItem('hr_p_v11'); localStorage.removeItem('hr_w_v11'); localStorage.removeItem('hr_h_v11');
        pool = JSON.parse(JSON.stringify(basePool)); wrongW = {}; hist = []; alert('기본 단어풀(' + pool.length + '개)로 초기화 완료!');
        closeM(); rDash(); return;
      }
      let ps = v.split(',');
      for(let i=0; i<ps.length; i++) {
        let kv = ps[i].split('=');
        if(kv.length===2 && kv[0].trim() && kv[1].trim()) {
          let w = kv[0].trim(), m = kv[1].trim();
          let existing = pool.find(item => item.w.toLowerCase() === w.toLowerCase());
          if(existing) existing.m = m;
          else pool.push({ w: w, m: m });
        }
      }
      save();
      alert("반영 완료! (현재 총 단어 수: " + pool.length + "개)");
      closeM(); rDash();
    }
    rDash();
  </script>
